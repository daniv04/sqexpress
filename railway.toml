[build]
builder = "railpack"

[build.environment]
PHP_EXTENSIONS = "ctype curl dom fileinfo filter hash mbstring openssl pcre pdo session tokenizer xml pdo_mysql intl zip"

[deploy]
startCommand = "php artisan migrate --force && php artisan db:seed --class=GeodataSeeder --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && bash -c 'if [ \"$RAILWAY_RUN_AS_WORKER\" = \"true\" ]; then php artisan queue:work --sleep=3 --tries=3 --max-time=3600; else php artisan serve --host=0.0.0.0 --port=$PORT; fi'"
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
